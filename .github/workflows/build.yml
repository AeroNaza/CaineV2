name: Build Caine Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow SpeechRecognition pyaudio pyserial google-generativeai edge-tts

      - name: Generar icono .ico
        run: |
          python -c "from PIL import Image; Image.open('assets/Cainelogo.png').save('assets/Cainelogo.ico', sizes=[(256,256),(64,64),(32,32)])"

      - name: Generar Caine.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Caine --icon assets\Cainelogo.ico --add-data "assets;assets" app.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Generar instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" caine.iss

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: CaineSetup
          path: Output/CaineSetup.exe
